[project]
name = "pool-simulator-backend"
version = "1.6.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn>=0.30",
    "sqlalchemy>=2.1.4",
    "alembic>=1.13",
    "pydantic>=2.14.1",
    "numpy>=2.5.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "argon2-cffi>=25.1.0",
    "websockets>=17.2",
    "webauthn>=3.0.1",
    "google-auth[requests]>=2.62.0",
    "cachecontrol>=0.14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.17.1", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
[tool.mypy]
strict = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
