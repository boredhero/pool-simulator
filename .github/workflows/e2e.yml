name: Browser checks (advisory)

on:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.suite }} ${{ matrix.shard }}
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: standalone, shard: 1, config: playwright.config.ts}
          - {suite: standalone, shard: 2, config: playwright.config.ts}
          - {suite: standalone, shard: 3, config: playwright.config.ts}
          - {suite: standalone, shard: 4, config: playwright.config.ts}
          - {suite: passkeys, shard: 1, config: playwright.passkeys.config.ts}
          - {suite: online, shard: 1, config: playwright.online.config.ts}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v7
        if: matrix.suite != 'standalone'
        with:
          enable-cache: true
      - name: Install integration backend
        if: matrix.suite != 'standalone'
        run: uv sync --project backend --frozen
      - name: Run browser checks
        working-directory: frontend
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          CONFIG: ${{ matrix.config }}
        run: |
          if [ "$SUITE" = standalone ]; then
            npx playwright test --config "$CONFIG" --shard "$SHARD/4" --workers=1 --reporter=list,blob
          else
            npx playwright test --config "$CONFIG" --workers=1 --reporter=list,blob
          fi
      - name: Upload results and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            frontend/blob-report/
            frontend/test-results/
          retention-days: 7

  report:
    name: Browser report
    if: always() && !cancelled()
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/download-artifact@v6
        with:
          pattern: browser-*
          path: browser-results
      - name: Collect reports
        run: |
          mkdir all-blob-reports
          find browser-results -path '*/blob-report/*.zip' -exec cp {} all-blob-reports/ \;
      - name: Merge browser report
        working-directory: frontend
        run: npx playwright merge-reports --reporter html ../all-blob-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report/
          retention-days: 7
