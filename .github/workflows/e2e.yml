name: Browser checks (advisory)

# Runs on development branches, independently of required CI and deployment.
# A failure stays visible but cannot delay or block develop -> main merges.
on:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Browsers + OS deps (cache miss)
        if: steps.pw.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: OS deps only (cache hit)
        if: steps.pw.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium && npx playwright install chromium

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend for online integration tests
        run: uv sync --project backend --frozen

      - name: Run e2e
        working-directory: frontend
        run: npx playwright test

      - name: Run online account and guest integration tests
        working-directory: frontend
        run: npm run test:online

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: frontend/test-results/
          retention-days: 7

