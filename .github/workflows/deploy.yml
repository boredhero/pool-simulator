name: Build and Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Stage deploy files
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: /tmp/pool-simulator-deploy/

      - name: Deploy
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          envs: GHCR_TOKEN,DEPLOY_SHA
          script: |
            set -e
            IMAGE="ghcr.io/${{ github.repository }}"
            mkdir -p ~/pool-simulator
            scp -o StrictHostKeyChecking=no /tmp/pool-simulator-deploy/docker-compose.prod.yml ~/pool-simulator/docker-compose.yml
            echo "${GHCR_TOKEN:-${{ secrets.GITHUB_TOKEN }}}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "${IMAGE}:${DEPLOY_SHA}"
            docker tag "${IMAGE}:${DEPLOY_SHA}" "${IMAGE}:latest"
            cd ~/pool-simulator && docker compose up -d --force-recreate --remove-orphans && docker compose ps
            for i in 1 2 3 4 5 6; do
              curl -sf http://localhost:8000/healthz && echo " [deploy OK]" && break
              sleep 10
            done
            rm -rf /tmp/pool-simulator-deploy
