name: CI

# Single workflow, parallel jobs. `ci` is the only required check in branch
# protection (it aggregates fast checks; advisory browser tests are separate).
# Triggers: main pushes + PR sync only — no duplicate runs (a develop push
# with an open PR runs once, as PR synchronize). Keep a PR open while
# working on develop, or use workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - 'info.yml'
              - 'Dockerfile'
              - 'scripts/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'changelog.json'
              - 'contracts/**'
              - 'info.yml'
              - 'Dockerfile'
              - 'scripts/**'
              - '.github/workflows/**'

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Deployment health-check regression
        run: sh scripts/test-check-deploy.sh

      - name: Ruff check
        run: uvx ruff check backend/

      - name: Ruff format check
        run: uvx ruff format --check backend/

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-python: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Run backend tests
        working-directory: backend
        run: uv run --no-sync pytest tests/ -v --tb=short

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  replay-parity:
    name: replay-parity
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Compare live Python and browser physics
        working-directory: frontend
        env:
          POOL_REPLAY_PARITY: '1'
        run: npm test -- --run tests/replayParity.test.ts

  docker:
    name: docker
    needs: changes
    # Validate the release container on PRs; publish only from main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: deploy
    needs: [docker, lint, test, frontend, replay-parity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check deploy secrets
        id: deploy
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stage deploy files
        if: steps.deploy.outputs.skip != 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,scripts/check-deploy.sh,scripts/google-client-id.py"
          target: /tmp/pool-simulator-deploy/

      - name: Deploy
        if: steps.deploy.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN_ENV: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          envs: GHCR_TOKEN,GITHUB_TOKEN_ENV,DEPLOY_SHA
          script: |
            set -e
            IMAGE="ghcr.io/${{ github.repository }}"
            mkdir -p ~/pool-simulator
            scp -o StrictHostKeyChecking=no /tmp/pool-simulator-deploy/docker-compose.prod.yml ~/pool-simulator/docker-compose.yml
            echo "${GHCR_TOKEN:-$GITHUB_TOKEN_ENV}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "${IMAGE}:${DEPLOY_SHA}"
            docker tag "${IMAGE}:${DEPLOY_SHA}" "${IMAGE}:latest"
            POOL_MARTINOSPIZZA_DEV_OAUTH_CLIENT_ID=$(python3 /tmp/pool-simulator-deploy/scripts/google-client-id.py)
            export POOL_MARTINOSPIZZA_DEV_OAUTH_CLIENT_ID
            cd ~/pool-simulator && docker compose up -d --force-recreate --remove-orphans && docker compose ps
            sh /tmp/pool-simulator-deploy/scripts/check-deploy.sh
            rm -rf /tmp/pool-simulator-deploy

  ci:
    name: ci
    if: always()
    needs: [changes, lint, test, frontend, replay-parity, docker, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize required checks
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = []
          for name, job in jobs.items():
              result = job["result"]
              print(f"{name}: {result}")
              if result in ("failure", "cancelled"):
                  failed.append(name)
          if failed:
              print("::error::Failed checks: " + ", ".join(failed))
              raise SystemExit(1)
          print("All required checks passed; intentionally skipped jobs are allowed.")
          PYTHON
