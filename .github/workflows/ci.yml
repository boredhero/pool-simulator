name: CI

# Single workflow, parallel jobs. `ci` is the only required check in branch
# protection (it aggregates, so path-skipped jobs never block merges).
# Triggers: main pushes + PR sync only — no duplicate runs (a develop push
# with an open PR runs once, as PR synchronize). Keep a PR open while
# working on develop, or use workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Ruff check
        run: uvx ruff check backend/

      - name: Ruff format check
        run: uvx ruff format --check backend/

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-python: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen || uv sync

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest tests/ -v --tb=short

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Browsers + OS deps (cache miss)
        if: steps.pw.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: OS deps only (cache hit)
        if: steps.pw.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium && npx playwright install chromium

      - name: Run e2e
        working-directory: frontend
        run: npx playwright test

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: deploy
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: deploy
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stage deploy files
        if: steps.deploy.outputs.skip != 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: /tmp/pool-simulator-deploy/

      - name: Deploy
        if: steps.deploy.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN_ENV: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          envs: GHCR_TOKEN,GITHUB_TOKEN_ENV,DEPLOY_SHA
          script: |
            set -e
            IMAGE="ghcr.io/${{ github.repository }}"
            mkdir -p ~/pool-simulator
            scp -o StrictHostKeyChecking=no /tmp/pool-simulator-deploy/docker-compose.prod.yml ~/pool-simulator/docker-compose.yml
            echo "${GHCR_TOKEN:-$GITHUB_TOKEN_ENV}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "${IMAGE}:${DEPLOY_SHA}"
            docker tag "${IMAGE}:${DEPLOY_SHA}" "${IMAGE}:latest"
            cd ~/pool-simulator && docker compose up -d --force-recreate --remove-orphans && docker compose ps
            for i in 1 2 3 4 5 6; do
              curl -sf http://localhost:8000/healthz && echo " [deploy OK]" && break
              sleep 10
            done
            rm -rf /tmp/pool-simulator-deploy

  ci:
    name: ci
    if: always()
    needs: [changes, lint, test, e2e, docker, deploy]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJson(needs) }}'
          if echo '${{ toJson(needs) }}' | grep -qE '"result": "(failure|cancelled)"'; then exit 1; fi
