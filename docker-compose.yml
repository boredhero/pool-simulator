services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - pool_data:/srv/data
    environment:
      JEV_API_KEY: ${JEV_API_KEY:-}
      ADMIN_ACCOUNT_ID: ${ADMIN_ACCOUNT_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8000}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      DATABASE_URL: sqlite:////srv/data/pool.db

volumes:
  pool_data:
