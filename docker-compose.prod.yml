# Production compose — runs on deploy host (see .github/workflows/deploy.yml).
# Single container: FastAPI serves API + frontend/dist.
services:
  api:
    image: ghcr.io/boredhero/pool-simulator:latest
    container_name: pool-simulator-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////srv/data/pool.db
      COOKIE_SECURE: "true"
      # Only the host reverse proxy can reach this loopback-published service.
      FORWARDED_ALLOW_IPS: "*"
      ALLOWED_ORIGINS: https://pool.martinospizza.dev
    volumes:
      - pool_data:/srv/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pool_data:
