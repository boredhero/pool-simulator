<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>pool-simulator</title>
<style>
html,body{margin:0;height:100%;overscroll-behavior:none}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{position:fixed;inset:0;pointer-events:none;padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.hud button{pointer-events:auto;min-height:48px;min-width:48px;touch-action:manipulation}
#app{height:100dvh}
</style>
</head>
<body>
<div id="app"><canvas id="game-canvas"></canvas>
<div class="hud"><button id="shoot">Shoot</button></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
