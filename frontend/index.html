<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<title>Play Pool</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f1e9;background:#100e0c;font-synthesis:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
button,input{font:inherit}
button{min-height:48px;padding:0 18px;border:1px solid #6d6254;border-radius:12px;background:#302b24;color:#fff8ed;font-size:16px;font-weight:600;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s}
button:hover{background:#484033;border-color:#d2b782}
button:focus-visible,input:focus-visible,.swatch:focus-visible{outline:3px solid #e7c384;outline-offset:3px}
button.on{background:#264e38;border-color:#88ba91}
#app{height:100dvh}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.topbar{position:absolute;top:20px;left:24px;right:24px;max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px;background:rgba(27,24,20,.96);border:1px solid #635747;border-radius:18px;padding:16px 20px;box-shadow:0 8px 28px #0004;pointer-events:auto}
.status{min-width:0;flex:1}
.status-meta{display:flex;gap:12px;align-items:center;margin-bottom:7px}
#turn{font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:750;color:#e2cfaa}
#turn.me{color:#acd2ad}
#version{font-size:12px;color:#b5ac9e}
#msg{font-size:clamp(18px,1.4vw,23px);font-weight:650;line-height:1.35;overflow-wrap:anywhere}
.toolbar,.row{display:flex;align-items:center;gap:10px}
#scorecard{position:fixed;top:126px;left:24px;display:flex;flex-direction:column;gap:12px;width:248px;pointer-events:none;z-index:2}
.pcard{background:rgba(27,24,20,.94);border:1px solid #635747;border-left:4px solid #635747;border-radius:14px;padding:16px;box-shadow:0 6px 22px #0003}
.pcard.active{border-color:#96bb8f;border-left-color:#b9dea9;background:rgba(32,46,33,.96)}
.pcard .pname{display:flex;flex-direction:column;gap:5px;font-size:19px;font-weight:700;line-height:1.2}
.pcard .grp{font-size:14px;font-weight:500;color:#ddd3c3}
.pcard .balls{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pcard .balls:empty{display:none}
.pball{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#111;box-shadow:inset 0 0 0 1px #ffffff80}
.pball span{display:flex;align-items:center;justify-content:center;border-radius:50%;width:15px;height:15px;background:#fff8ee;color:#181511;font-size:10px}
.pball.potted{opacity:.3}
.control-tray{position:absolute;bottom:20px;left:24px;right:24px;margin:auto;max-width:940px;display:flex;align-items:center;gap:24px;padding:14px 20px;border:1px solid #635747;border-radius:18px;background:rgba(27,24,20,.96);box-shadow:0 8px 28px #0004;pointer-events:auto}
.power-control{flex:1;min-width:100px}
.control-label{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:650;color:#e2cfaa;margin-bottom:8px}
#chargebar{height:14px;border-radius:7px;background:#62584b;overflow:hidden}
#chargefill{height:100%;width:0%;border-radius:7px;background:linear-gradient(90deg,#80b58b,#e6bd71,#dd765c)}
.control-help{font-size:13px;color:#c7bdad;margin-top:6px}
.spin-control{display:flex;align-items:center;gap:12px;border-left:1px solid #635747;padding-left:24px}
.spin-control .control-label{margin:0}
#spin{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at center,#f7f1e3 17%,#995748 18%,#995748 24%,#f7f1e3 25%);position:relative;touch-action:none;flex:none;cursor:crosshair;box-shadow:inset -3px -4px 8px #0003}
#spin::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#244c73;transform:translate(var(--tx,0px),var(--ty,0px))}
.hint{position:absolute;bottom:132px;left:20px;right:20px;text-align:center;font-size:15px;line-height:1.5;color:#eee4d0;text-shadow:0 2px 5px #000;transition:opacity .5s;pointer-events:none}
.hint.gone{opacity:0}
#settingspanel,#onlinepanel{position:fixed;top:122px;right:24px;width:300px;max-height:calc(100dvh - 150px);overflow:auto;background:#211d18;border:1px solid #8d795c;border-radius:16px;padding:20px;display:none;flex-direction:column;gap:12px;z-index:5;box-shadow:0 12px 48px #0008}
#settingspanel.open,#onlinepanel.open{display:flex}
#settingspanel label,#onlinepanel label{font-size:15px;font-weight:650;color:#e2cfaa}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;border:2px solid #ffffff30}
.swatch.sel{border-color:#ffe4af;box-shadow:0 0 0 2px #ffe4af50}
#settingspanel input[type=color]{width:100%;height:44px;border:1px solid #6d6254;border-radius:8px;background:none;padding:3px}
#onlinepanel input{width:100%;min-height:48px;border-radius:10px;border:1px solid #80705c;background:#151310;color:#fff;padding:0 12px;font-size:17px}
#onlinepanel .row>button{flex:1;padding:0 10px}
#roominfo{font-size:14px;color:#d7c9b4}
@media(min-width:1800px){.topbar{top:28px}.control-tray{bottom:28px}#scorecard{top:148px;left:32px;width:280px}.pcard .pname{font-size:22px}.pcard .grp{font-size:16px}.pball{width:30px;height:30px}}
@media(max-width:900px){#scorecard{top:124px;left:24px;right:24px;width:auto;flex-direction:row}.pcard{flex:1;padding:12px 14px}.pcard .pname{font-size:17px}.pcard .grp{font-size:13px}.pcard .balls{gap:4px;margin-top:8px}.pball{width:23px;height:23px}.topbar{gap:12px}.control-tray{gap:16px}.spin-control{padding-left:16px}}
@media(max-width:600px){.topbar{top:12px;left:12px;right:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;border-radius:14px}.status{display:contents}.status-meta{grid-column:1;grid-row:1;margin:0;gap:8px}#turn{font-size:12px}#version{font-size:10px}.toolbar{grid-column:2;grid-row:1;gap:6px}.toolbar button{font-size:13px;padding:0 10px;min-height:44px}#msg{grid-column:1 / -1;grid-row:2;font-size:17px;line-height:1.3}#scorecard{top:136px;left:12px;right:12px;gap:8px}.pcard{padding:10px;border-radius:12px}.pcard .pname{font-size:16px}.pcard .grp{font-size:12px}.pball{width:21px;height:21px}.control-tray{bottom:12px;left:12px;right:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:12px;border-radius:14px}.control-tray .actions{grid-column:1 / -1}.actions button{flex:1}.control-help{font-size:12px}.spin-control{padding-left:12px;gap:8px}.spin-control .control-label{font-size:11px}#spin{width:48px;height:48px}.hint{bottom:184px;font-size:13px}#settingspanel,#onlinepanel{top:126px;right:12px;left:12px;width:auto;max-height:calc(100dvh - 150px)}}
@media(max-height:600px) and (min-width:601px){.topbar{top:8px;padding:8px 14px}#scorecard{top:90px;width:190px;flex-direction:column}.pcard{padding:10px}.pcard .balls{display:none}.control-tray{bottom:8px;padding:8px 14px}.control-help{display:none}.hint{bottom:96px}}
</style>
</head>
<body>
<div id="app"><canvas id="game-canvas"></canvas>
<div class="hud">
  <div class="topbar">
    <div class="status">
      <div class="status-meta"><span id="turn">Player 1</span><span id="version"></span></div>
      <div id="msg" role="status" aria-live="polite">Player 1 to break</div>
    </div>
    <div class="toolbar">
      <button id="settingsbtn" title="Table settings">Table</button>
      <button id="onlinebtn">Online</button>
    </div>
  </div>
  <div class="hint" id="hint">Aim on the felt · pull back and release to shoot · right-drag to orbit</div>
  <div class="control-tray">
    <div class="power-control"><span class="control-label">Shot power</span><div id="chargebar"><div id="chargefill"></div></div><div class="control-help">Pull farther for a stronger shot</div></div>
    <div class="spin-control"><span class="control-label">Spin</span><div id="spin" title="Tip offset (english)" aria-label="Cue ball spin control"></div></div>
    <div class="row actions"><button id="aibtn">Play vs AI</button><button id="rack">New rack</button></div>
  </div>
</div>
<div id="scorecard"></div>
<div id="settingspanel">
  <label>Felt</label>
  <div class="swatches" id="feltsw"></div>
  <label>Rails</label>
  <div class="swatches" id="woodsw"></div>
  <label>Custom felt</label>
  <input type="color" id="feltcustom" value="#0a6c2f" />
  <label>Custom rails</label>
  <input type="color" id="woodcustom" value="#4a2c14" />
</div>
<div id="onlinepanel">
  <label for="pname">Your name</label>
  <input id="pname" placeholder="your name" maxlength="24" />
  <label for="rcode">Room code</label>
  <input id="rcode" placeholder="room code" maxlength="4" style="text-transform:uppercase" />
  <div class="row"><button id="createbtn">Create room</button><button id="joinbtn">Join</button></div>
  <span id="roominfo">solo table</span>
</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
