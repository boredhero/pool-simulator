<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<title>Play Pool</title>
<style>
html,body{margin:0;height:100%;overscroll-behavior:none;background:#0b1020;color:#eee;font-family:system-ui}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.hud{position:fixed;inset:0;pointer-events:none;padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;gap:8px;align-items:center}
.row>*{pointer-events:auto}
#msg{background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;font-size:14px;flex:1}
#turn{background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap}
#version{font-size:12px;opacity:.7;pointer-events:none}
button{min-height:44px;min-width:44px;touch-action:manipulation;border-radius:10px;border:1px solid #555;background:#1c2742;color:#fff;font-size:14px;padding:0 12px}
button:disabled{opacity:.4}
button.on{background:#2c5a2c;border-color:#4caf50}
#onlinepanel{position:fixed;top:calc(56px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));background:rgba(10,14,28,.95);border:1px solid #555;border-radius:12px;padding:12px;display:none;flex-direction:column;gap:8px;pointer-events:auto;z-index:5}
#onlinepanel.open{display:flex}
#onlinepanel input{min-height:44px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;padding:0 10px;width:150px}
#roominfo{font-size:12px;opacity:.8}
#chargebar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);flex:1;max-width:280px;overflow:hidden}
#chargefill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#4caf50,#ffc107,#f44336)}
#spin{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at center,#f8f8f8 18%,#c33 19%,#c33 26%,#eee 27%);position:relative;touch-action:none;flex:none}
#spin::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#2244aa;transform:translate(var(--tx,0px),var(--ty,0px))}
.spacer{flex:1;pointer-events:none}
#app{height:100dvh}
.hint{font-size:12px;opacity:.65;text-align:center;pointer-events:none}
@media (pointer:coarse){button{font-size:15px}#msg{font-size:13px}}
</style>
</head>
<body>
<div id="app"><canvas id="game-canvas"></canvas>
<div class="hud">
  <div class="row"><div id="msg">…</div><div id="turn">…</div><span id="version"></span><button id="onlinebtn">Online</button></div>
  <div class="hint">drag to aim · press &amp; hold to charge · release to shoot</div>
  <div class="row">
    <div id="chargebar"><div id="chargefill"></div></div>
    <div id="spin" title="Tip offset (english)"></div>
    <div class="spacer"></div>
    <button id="orbitbtn">Orbit</button>
    <button id="aibtn">vs AI</button>
    <button id="rack">Rack</button>
  </div>
</div>
<div id="onlinepanel">
  <input id="pname" placeholder="your name" maxlength="24" />
  <input id="rcode" placeholder="room code" maxlength="4" style="text-transform:uppercase" />
  <div class="row"><button id="createbtn">Create room</button><button id="joinbtn">Join</button></div>
  <span id="roominfo">solo table</span>
</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
